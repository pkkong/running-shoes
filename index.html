<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>디시인사이드 러닝갤러리 러닝화 추천</title>
    <link rel="stylesheet" href="styles.css?v=20260609-compact-filter-1" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <div class="topbar__brand">
          <h1>러닝화 추천표</h1>
          <a
            class="source-link"
            href="https://gall.dcinside.com/mgallery/board/view/?id=running&no=1042108&page=1"
            target="_blank"
            rel="noreferrer"
          >
            러닝갤 원문
          </a>
        </div>
        <nav class="global-view-nav" aria-label="보기 전환">
          <a id="pickerLink" class="view-link" href="#/" aria-label="집중 보기" title="집중 보기">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="7"></circle>
              <circle cx="12" cy="12" r="2"></circle>
              <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
            </svg>
            <span class="visually-hidden">집중 보기</span>
          </a>
          <a id="overviewLink" class="view-link" href="#/overview" aria-label="맵" title="맵">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"></path>
            </svg>
            <span class="visually-hidden">맵</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="app-shell">
      <section id="periodArchive" class="period-archive" aria-label="분기별 러닝화 라인업"></section>

      <section id="filterPanel" class="control-panel" aria-label="러닝화 필터">
        <label class="search-field">
          <span>검색</span>
          <input id="searchInput" type="search" placeholder="모델명, 브랜드, 종류 검색" autocomplete="off" />
        </label>

        <div class="filter-block">
          <div class="filter-block__head">
            <h2>브랜드</h2>
            <button id="resetButton" class="icon-button" type="button" aria-label="필터 초기화" title="필터 초기화">
              ↺
            </button>
          </div>
          <div id="brandFilters" class="chip-row" role="group" aria-label="브랜드 필터"></div>
        </div>

        <div class="filter-grid">
          <div class="filter-block">
            <h2>대분류</h2>
            <div id="groupFilters" class="chip-row" role="group" aria-label="대분류 필터"></div>
          </div>
          <div class="filter-block">
            <h2>종류</h2>
            <div id="categoryFilters" class="chip-row" role="group" aria-label="종류 필터"></div>
          </div>
        </div>

        <div class="filter-block">
          <h2>추천 태그</h2>
          <div id="tagFilters" class="chip-row" role="group" aria-label="추천 태그 필터"></div>
        </div>

        <div class="filter-block">
          <h2>변화</h2>
          <div id="changeFilters" class="chip-row" role="group" aria-label="분기 변화 필터"></div>
        </div>

        <div class="filter-block filter-block--view">
          <h2>정렬</h2>
          <div class="view-actions">
            <select id="sortSelect" aria-label="정렬">
              <option value="table">원문 표 순서</option>
              <option value="brand">브랜드순</option>
              <option value="category">종류순</option>
              <option value="drop">드롭 낮은순</option>
            </select>
          </div>
        </div>
      </section>

      <div id="homeView" hidden aria-hidden="true">
        <section class="results-head" aria-live="polite">
          <div>
            <p class="eyebrow">List</p>
            <h2 id="resultTitle">추천표 전체</h2>
          </div>
        </section>

        <section id="shoeGrid" class="shoe-grid" aria-label="러닝화 목록"></section>

        <section id="emptyState" class="empty-state" hidden>
          <h2>조건에 맞는 러닝화가 없습니다</h2>
          <p>검색어를 줄이거나 필터를 초기화해 보세요.</p>
        </section>
      </div>

      <section id="overviewView" class="overview-view" aria-label="러닝화 맵" hidden>
        <div class="map-hero">
          <div class="map-hero__copy">
            <p class="eyebrow">Map</p>
            <h2 id="overviewTitle">러닝화 맵</h2>
            <p>브랜드와 용도별 제품 분포를 한 화면에서 탐색하세요.</p>
          </div>
        </div>

        <section id="mapControlPanel" class="map-control-panel" aria-label="러닝화 맵 필터">
          <div>
            <h3>용도</h3>
            <div id="mapGroupFilters" class="segmented-control" role="group" aria-label="용도 필터"></div>
          </div>
          <div>
            <h3>브랜드</h3>
            <div id="mapBrandFilters" class="map-chip-row" role="group" aria-label="브랜드 필터"></div>
          </div>
          <div>
            <h3>변화</h3>
            <div id="mapChangeFilters" class="segmented-control" role="group" aria-label="분기 변화 필터"></div>
          </div>
          <label class="map-search-field">
            <span>검색</span>
            <input id="mapSearchInput" type="search" placeholder="제품명, 브랜드 검색" autocomplete="off" />
          </label>
        </section>

        <section id="mapViewShell" class="shoe-map-section" aria-label="전체 러닝화 맵">
          <div class="shoe-map-toolbar">
            <div class="shoe-map-toolbar__main">
              <p id="mapSummary" class="map-summary">추천표 전체</p>
              <div class="zoom-controls" role="group" aria-label="맵 확대 축소">
                <button id="zoomOutButton" class="zoom-button" type="button" aria-label="맵 축소">−</button>
                <button id="zoomResetButton" class="zoom-button zoom-button--wide" type="button" aria-label="맵 배율 맞춤">맞춤</button>
                <button id="zoomInButton" class="zoom-button" type="button" aria-label="맵 확대">+</button>
              </div>
            </div>
            <div id="mapMiniMap" class="map-minimap" aria-hidden="true"></div>
          </div>
          <div class="shoe-map-shell">
            <div id="mapViewport" class="shoe-map-viewport" tabindex="0" aria-label="브랜드와 카테고리 러닝화 맵">
              <div id="shoeMapCanvas" class="shoe-map-canvas"></div>
            </div>
          </div>
        </section>
      </section>

      <section id="pickerView" class="picker-view" aria-label="집중 보기" hidden>
        <div class="picker-shell">
          <header class="picker-header">
            <div>
              <p class="eyebrow">Lineup</p>
              <h2>러닝화 라인업</h2>
            </div>
            <div class="picker-header__meta">
              <strong id="pickerCoordinate" class="visually-hidden">Nike × 입문화</strong>
              <span id="pickerSummary">2026.05 · 제품 선택</span>
            </div>
          </header>

          <section class="picker-choice-rail" aria-label="라인업 선택">
            <div class="picker-filter-dock" aria-label="라인업 조건">
              <button
                id="pickerPeriodTrigger"
                class="picker-filter-trigger"
                type="button"
                aria-expanded="false"
                aria-controls="pickerPeriodPanel"
              ></button>
              <button
                id="pickerCategoryTrigger"
                class="picker-filter-trigger"
                type="button"
                aria-expanded="false"
                aria-controls="pickerCategoryPanel"
              ></button>
            </div>

            <div id="pickerPeriodPanel" class="picker-filter-panel" hidden></div>
            <div id="pickerCategoryPanel" class="picker-filter-panel" hidden></div>

            <div class="picker-axis-block picker-axis-block--category" aria-label="카테고리 선택">
              <div
                id="pickerCategoryAxis"
                class="picker-axis picker-axis--horizontal picker-axis--category"
                role="listbox"
                tabindex="0"
                aria-label="카테고리 피커"
              ></div>
            </div>

            <div class="picker-axis-block picker-axis-block--brand" aria-label="브랜드 선택">
              <div
                id="pickerBrandAxis"
                class="picker-axis picker-axis--horizontal picker-axis--brand"
                role="listbox"
                tabindex="0"
                aria-label="브랜드 피커"
              ></div>
            </div>
          </section>

          <section class="picker-main" aria-label="선택된 라인업 제품">
            <div class="picker-detail-zone">
              <article id="pickerDetail" class="picker-detail-card" aria-live="polite"></article>
            </div>
          </section>
        </div>
      </section>

      <section id="detailView" class="detail-view" aria-label="러닝화 상세" hidden></section>
    </main>

    <div id="mapSheetBackdrop" class="sheet-backdrop" hidden></div>
    <section
      id="mapSheet"
      class="bottom-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="mapSheetTitle"
      hidden
    ></section>

    <footer class="footer">
      <p>가격은 네이버 쇼핑 검색 API 기반 후보입니다. 구매 전 사이즈, 배송비, 재고를 확인하세요.</p>
    </footer>

    <script src="data/shoes.js?v=20260609-compact-filter-1"></script>
    <script src="data/lineup-history.js?v=20260609-compact-filter-1"></script>
    <script src="data/price-queries.js?v=20260609-compact-filter-1"></script>
    <script src="data/prices/latest.js?v=20260609-compact-filter-1"></script>
    <script src="app.js?v=20260609-compact-filter-1"></script>
  </body>
</html>
